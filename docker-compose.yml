services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:17
    container_name: analyst-postgres
    environment:
      - POSTGRES_USER=analyst
      - POSTGRES_PASSWORD=analyst_secret
      - POSTGRES_DB=analytics
    ports:
      - "5433:5432"            # 5433 на хосте → 5432 в контейнере (твой хост 5432 не трогаем)
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 12

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analyst-swarm-agent

    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
          pids: 100

    read_only: true

    tmpfs:
      - /tmp:size=100M

    volumes:
      - ./memory:/app/memory:rw
      - ./skills:/app/skills:ro
      - ./agents:/app/agents:ro
      - ./logs:/app/logs:rw
      - ./data:/app/data:ro
      - ./reports:/app/reports:rw

    environment:
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=analyst
      - POSTGRES_PASSWORD=analyst_secret
      - POSTGRES_DB=analytics
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - MPLCONFIGDIR=/tmp/matplotlib

    networks:
      - agent-net

    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

networks:
  agent-net:
    driver: bridge

volumes:
  ollama-data:
  postgres-data: